# Org-level GitHub Actions runner pool on the owned cluster (ADR-PLT-0015 #3).
# Founder-applied via the runbook in runner/README.md; agents never kubectl-apply
# this (fleet rule 10).
apiVersion: v1
kind: Service
metadata:
  name: actions-runner
  namespace: ci-runners
spec:
  clusterIP: None
  selector: { app: actions-runner }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: actions-runner
  namespace: ci-runners
spec:
  serviceName: actions-runner
  replicas: 2
  selector:
    matchLabels: { app: actions-runner }
  template:
    metadata:
      labels: { app: actions-runner }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The runner image's own user: config.User=runner, APP_UID=1654.
        # 1000 cannot read /home/runner and config.sh fails with permission denied.
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.327.1
          env:
            - name: RUNNER_ALLOW_RUNASROOT
              value: "false"
            - name: RUNNER_ORG_URL
              value: https://github.com/PalupGG
            - name: RUNNER_LABELS
              value: "palupgg-ci" # self-hosted/Linux/X64 are added by the runner itself
            - name: RUNNER_NAME_PREFIX
              value: "palupgg-"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef: { name: runner-reg, key: token }
            - name: RUNNER_WORKDIR
              value: /data/work
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ ! -f /data/.runner ]; then
                ./config.sh --unattended --url "$RUNNER_ORG_URL" --token "$RUNNER_TOKEN" \
                  --labels "$RUNNER_LABELS" --name "$RUNNER_NAME_PREFIX$(hostname)" \
                  --work "$RUNNER_WORKDIR"
              fi
              exec ./run.sh
          resources:
            requests: { cpu: "2", memory: 4Gi } # cargo builds; burstable to the limits
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # The cluster's only StorageClass; it carries no default annotation, so the
        # claim must name it or the pod stays Pending on an unbound PVC.
        storageClassName: local-path
        resources: { requests: { storage: 20Gi } }
