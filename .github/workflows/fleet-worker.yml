name: fleet-worker

# Build and deploy a Cloudflare Worker from a fleet service repo.
#
# Ownership: this workflow owns the Worker script, assets, and version via
# wrangler. DNS, the tunnel, WAF, and the Worker custom domain stay in
# Terraform Cloud (gitops/edge); this workflow never touches them.
#
# A service repo calls this with a build command and the Wrangler config path.
# The caller keeps only its thin `site.yml` / `worker.yml`.

on:
  workflow_call:
    inputs:
      service:
        description: Service name used for the build artifact.
        required: true
        type: string
      worker_name:
        description: Cloudflare Worker name (must match the Wrangler config).
        required: true
        type: string
      config_path:
        description: Path to the Wrangler config.
        required: true
        type: string
      assets_dir:
        description: Directory containing the built static assets.
        required: true
        type: string
      build_command:
        description: Command that produces the static assets.
        required: true
        type: string
      environment:
        description: GitHub environment (staging or prod).
        required: false
        type: string
        default: staging
      cloudflare_account_id:
        description: Cloudflare account ID.
        required: true
        type: string
      build_runner:
        description: 'JSON array of runner labels for the build job, e.g. ["ubuntu-latest"] or ["self-hosted","palupgg-build"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      FLEET_TOKEN:
        description: Read token for the private kernel dependency.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: Workers Scripts Edit token (required for deploy, optional for PR build).
        required: false

permissions:
  contents: read

jobs:
  build:
    # Hosted by default; a repository with a runner that has a C linker and the
    # Rust/Node toolchain (the Minisforum `palupgg-build`) passes its labels.
    runs-on: ${{ fromJSON(inputs.build_runner) }}
    timeout-minutes: 30
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (fleet pin)

      - name: Install Rust (hosted runners have no toolchain)
        if: contains(inputs.build_runner, 'ubuntu-latest')
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Kernel git credential helper (FLEET_TOKEN, never logged)
        if: env.FLEET_TOKEN != ''
        run: git config --global credential.helper '!f() { echo username=x-access-token; echo password="${FLEET_TOKEN}"; }; f'

      - name: Build static export
        run: ${{ inputs.build_command }}

      - name: Validate Worker bundle (no upload)
        run: npx --yes wrangler@4.162.0 deploy --dry-run --config ${{ inputs.config_path }}

      - name: Upload static export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.service }}-dist
          path: ${{ inputs.assets_dir }}
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, palupgg-ci]
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (fleet pin)

      - name: Download static export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.service }}-dist
          path: ${{ inputs.assets_dir }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Deploy Worker
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.162.0 deploy --config "${{ inputs.config_path }}" --name "${{ inputs.worker_name }}" 2>&1 | tee /tmp/deploy.log
          # First https://*.workers.dev URL the deploy printed. Empty when wrangler
          # published no workers.dev target (custom-domain-only Worker, or the
          # "No targets deployed" case) — the smoke step then skips explicitly.
          url=$(grep -oE 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          echo "deploy_url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke the deployed URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::no workers.dev URL in the deploy output — nothing was published to smoke (custom-domain-only Worker or no targets deployed); smoke skipped"
            exit 0
          fi
          fail=0

          code=$(curl -sS -o /tmp/smoke-healthz.body -D /tmp/smoke-healthz.hdr -w '%{http_code}' --max-time 20 "$DEPLOY_URL/healthz")
          healthz_body=$(cat /tmp/smoke-healthz.body)
          echo "GET $DEPLOY_URL/healthz -> $code $healthz_body"
          [ "$code" = "200" ] || { echo "::error::/healthz status $code, expected 200"; fail=1; }
          [ "$healthz_body" = "ok" ] || { echo "::error::/healthz body '$healthz_body', expected 'ok'"; fail=1; }

          code=$(curl -sS -o /tmp/smoke-root.body -D /tmp/smoke-root.hdr -w '%{http_code}' --max-time 20 "$DEPLOY_URL/")
          echo "GET $DEPLOY_URL/ -> $code"
          [ "$code" = "200" ] || { echo "::error::/ status $code, expected 200"; fail=1; }

          # Security headers asserted on both responses.
          for pair in "healthz /tmp/smoke-healthz.hdr" "root /tmp/smoke-root.hdr"; do
            set -- $pair
            label=$1; hdr=$2
            for check in "x-content-type-options nosniff" "content-security-policy" "referrer-policy"; do
              set -- $check
              header=$1; want=${2:-}
              if grep -qiE "^$header:[[:space:]]*$want" "$hdr"; then
                echo "smoke $label: $header present"
              else
                echo "::error::$label: missing or wrong $header (want: ${want:-any value})"
                grep -i "^$header" "$hdr" || echo "  (header absent)"
                fail=1
              fi
            done
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::smoke failed for $DEPLOY_URL — the deployed Worker does not meet the contract"
            exit 1
          fi
          echo "smoke passed: $DEPLOY_URL answered healthz=ok, / 200, with the three security headers"
