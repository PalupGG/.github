name: fleet-ci

on:
  workflow_call:
    inputs:
      kernel-role:
        description: "Run the boundary gate with --role kernel (true only in the kernel repository)"
        type: boolean
        default: false
      runs-on:
        description: 'JSON array of runner labels for the plain gate job, e.g. ["ubuntu-latest"] or ["self-hosted","palupgg-build"]'
        type: string
        default: '["ubuntu-latest"]'
      postgres-runs-on:
        description: 'JSON array of runner labels for the Postgres twin (needs Docker), e.g. ["ubuntu-latest"]'
        type: string
        default: '["ubuntu-latest"]'
      postgres:
        description: "Run the gates beside a postgres:17-alpine service for database-backed suites"
        type: boolean
        default: false
      postgres-env:
        description: "Env var the repo's tests read the connection URL from; set to the service URL when postgres is true"
        type: string
        default: "DATABASE_URL"
      postgres-database:
        description: "Database the service creates and the URL points at (when postgres is true)"
        type: string
        default: "test"
      worker-tests:
        description: "Provision the Rust Worker test toolchain (wasm32 target + worker-build) and prove workerd boots before the gates"
        type: boolean
        default: false
      edge-smoke-url:
        description: "Public /healthz URL of the DEPLOYED environment, smoked through the edge after the gates (issue #36); empty (default) skips the leg. Best-effort: no answer (network blip) or a 403 from a non-allowlisted egress warns and continues; a wrong URL (non-200) or a body missing edge-smoke-version fails."
        type: string
        default: ""
      edge-smoke-version:
        description: "Version marker the deployed /healthz body must contain when edge-smoke-url is set (today the fleet contract is 'ok'; a deploy version id fits once services expose one)"
        type: string
        default: ""
    secrets:
      FLEET_TOKEN:
        description: "Read-only token that can fetch SanctuaryGG/kernel (not needed in the kernel repository itself)"
        required: false

permissions:
  contents: read

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: inputs.postgres == false
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup show

      # A Rust Worker's tests boot `wrangler dev`, whose build command is
      # `worker-build` (workers-rs). Neither the wasm target nor that binary is
      # part of the pinned Rust toolchain, so the suite fails at the build command
      # instead of at an assertion. worker-build is version-pinned here: it is a
      # toolchain, and an unpinned toolchain makes a green unreproducible.
      - name: Worker test toolchain (wasm32 + worker-build)
        if: inputs.worker-tests
        run: |
          rustup target add wasm32-unknown-unknown
          command -v worker-build >/dev/null 2>&1 || cargo install worker-build --version 0.9.0 --locked

      - name: Cache cargo (hosted runners)
        if: contains(inputs.runs-on, 'ubuntu-latest')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Kernel git credential helper (FLEET_TOKEN, never logged)
        if: env.FLEET_TOKEN != ''
        run: git config --global credential.helper '!f() { echo username=x-access-token; echo password="$FLEET_TOKEN"; }; f'

      - name: Gate — boundary selftest
        run: sh scripts/check-boundaries.sh --selftest

      - name: Gate — boundary gate
        if: inputs.kernel-role == false
        run: sh scripts/check-boundaries.sh

      - name: Gate — boundary gate (kernel role)
        if: inputs.kernel-role == true
        run: sh scripts/check-boundaries.sh --role kernel

      - name: Gate — rustfmt
        run: cargo fmt --all --check

      - name: Gate — clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Gate — tests
        run: cargo test

  worker-smoke:
    # The environment proof, independent of any service: a throwaway JS Worker must
    # answer /healthz and echo one WebSocket message under `wrangler dev`. A service
    # suite failing then tells you the *service* is red only after this job is green.
    if: inputs.worker-tests
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Boot a throwaway Worker under workerd
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/worker-smoke"
          mkdir -p "$d/src"
          printf '%s\n' '{ "name": "worker-smoke", "main": "src/index.js", "compatibility_date": "2026-11-01" }' > "$d/wrangler.jsonc"
          cat > "$d/src/index.js" <<'JS'
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              if (url.pathname === "/healthz") return new Response("ok");
              if (url.pathname === "/ws") {
                const pair = new WebSocketPair();
                const [client, server] = Object.values(pair);
                server.accept();
                server.addEventListener("message", (event) => server.send(`echo:${event.data}`));
                return new Response(null, { status: 101, webSocket: client });
              }
              return new Response("not found", { status: 404 });
            },
          };
          JS
          cd "$d"
          npx --yes wrangler@4.163.0 dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler-smoke.log" 2>&1 &
          for _ in $(seq 1 120); do
            if [ "$(curl -fsS http://127.0.0.1:8787/healthz 2>/dev/null || true)" = "ok" ]; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8787/healthz)" = "ok"
          node -e '
          const ws = new WebSocket("ws://127.0.0.1:8787/ws");
          const timer = setTimeout(() => { console.error("no echo within 10s"); process.exit(1); }, 10000);
          ws.onopen = () => ws.send("ping");
          ws.onmessage = (event) => { clearTimeout(timer); console.log(event.data); process.exit(event.data === "echo:ping" ? 0 : 1); };
          '

      - name: wrangler log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/wrangler-smoke.log" || true

  edge-smoke:
    # Issue #36: a deploy is smoked through the WAN, not only loopback. One
    # allowlisted curl of the DEPLOYED environment's /healthz, hard-bounded
    # (--connect-timeout/--max-time) and best-effort by design: no answer (a
    # network blip) or a 403 from an egress the WAF does not allowlist warns and
    # continues, while a wrong URL (non-200) or a body missing the expected
    # version marker fails. No `needs:` on purpose — a skipped need skips the
    # dependent, and exactly one gates leg always skips (the twin pattern below);
    # the leg is a read-only GET that must also stay exercisable standalone,
    # which is how the selftest calls it in THIS repo (whose gate jobs fail at
    # the boundary step by design — no scripts/ here).
    if: inputs.edge-smoke-url != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Edge smoke — one allowlisted curl of the deployed /healthz
        env:
          EDGE_URL: ${{ inputs.edge-smoke-url }}
          EXPECTED: ${{ inputs.edge-smoke-version }}
        run: |
          set -euo pipefail
          # ONE curl, classified by the HTTP code it yields. `|| true` keeps the
          # exit status in $code; the body lands in $body for the marker check.
          # The rm -f first: a failed curl must not leave a PREVIOUS body behind.
          rm -f /tmp/healthz
          code=$(curl -sS -o /tmp/healthz -w '%{http_code}' --connect-timeout 10 --max-time 20 "$EDGE_URL" || true)
          body=$(cat /tmp/healthz 2>/dev/null || true)
          echo "GET $EDGE_URL -> HTTP $code"
          echo "body: $body"
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::warning::no answer within the timeout — network blip or egress gap; best-effort, continuing (issue #36)"
            exit 0
          fi
          if [ "$code" = "403" ]; then
            echo "::warning::403 — this runner's egress is not in the Cloudflare allowlist; verify from an allowlisted host"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wrong URL or broken deployment: GET $EDGE_URL answered HTTP $code, expected 200"
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::warning::reachable and healthy (200) but no edge-smoke-version configured — only reachability was proven"
            exit 0
          fi
          if ! grep -Fq -- "$EXPECTED" <<<"$body"; then
            echo "::error::stale or wrong version marker: expected '$EXPECTED' in the /healthz body, got '$body'"
            exit 1
          fi
          echo "edge smoke passed: $EDGE_URL answered 200 with the expected marker"

  gates-postgres:
    # The postgres opt-in. GitHub Actions has no conditional `services:` (actions/runner#822),
    # so the opt-in is this twin of `gates`, skipped unless postgres is true. Keep the gate
    # steps in lockstep with `gates` above.
    if: inputs.postgres == true
    runs-on: ${{ fromJSON(inputs.postgres-runs-on) }}
    timeout-minutes: 45
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
      CARGO_TERM_COLOR: always
      POSTGRES_PASSWORD: postgres # job-local dummy, never a secret; the service URL embeds it
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres # same dummy; services cannot read the job env context
          POSTGRES_DB: ${{ inputs.postgres-database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Point ${{ inputs.postgres-env }} at the Postgres service
        run: echo "${{ inputs.postgres-env }}=postgres://postgres:${POSTGRES_PASSWORD}@localhost:5432/${{ inputs.postgres-database }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup set profile minimal
          rustup show

      - name: Worker test toolchain (wasm32 + worker-build)
        if: inputs.worker-tests
        run: |
          rustup target add wasm32-unknown-unknown
          command -v worker-build >/dev/null 2>&1 || cargo install worker-build --version 0.9.0 --locked

      - name: Cache cargo (hosted runners)
        if: contains(inputs.postgres-runs-on, 'ubuntu-latest')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Kernel git credential helper (FLEET_TOKEN, never logged)
        if: env.FLEET_TOKEN != ''
        run: git config --global credential.helper '!f() { echo username=x-access-token; echo password="$FLEET_TOKEN"; }; f'

      - name: Gate — boundary selftest
        run: sh scripts/check-boundaries.sh --selftest

      - name: Gate — boundary gate
        if: inputs.kernel-role == false
        run: sh scripts/check-boundaries.sh

      - name: Gate — boundary gate (kernel role)
        if: inputs.kernel-role == true
        run: sh scripts/check-boundaries.sh --role kernel

      - name: Gate — rustfmt
        run: cargo fmt --all --check

      - name: Gate — clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Gate — tests
        run: cargo test
