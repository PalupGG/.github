name: selftest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-check:
    # Calls the reusable workflow; jobs failing at the boundary-gate step (this repo
    # has no scripts/) proves composition works.
    uses: SanctuaryGG/.github/.github/workflows/fleet-ci.yml@main
    with:
      runs-on: ubuntu-latest
  release-compose-check:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: SanctuaryGG/.github/.github/workflows/fleet-release.yml@main
    permissions:
      contents: write # reusable workflows cannot elevate: the caller must grant what the callee needs
    with:
      runs-on: ubuntu-latest
