name: selftest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-check:
    # Calls the reusable workflow; jobs failing at the boundary-gate step (this repo
    # has no scripts/) proves composition works.
    uses: PalupGG/.github/.github/workflows/fleet-ci.yml@main
    with:
      runs-on: ubuntu-latest
  image-compose-check:
    # Same proof for fleet-image: the job must START and fail at a real step (no
    # Cargo.toml in this repo) — that is composition proven, not a broken callee.
    uses: PalupGG/.github/.github/workflows/fleet-image.yml@main
    with:
      runs-on: ubuntu-latest
      service: selftest
  release-compose-check:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: PalupGG/.github/.github/workflows/fleet-release.yml@main
    permissions:
      contents: write # reusable workflows cannot elevate: the caller must grant what the callee needs
    with:
      runs-on: ubuntu-latest
